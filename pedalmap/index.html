<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Canonical host: Firebase serves the same site on *.web.app — bounce early. -->
    <script>
      (function () {
        var h = location.hostname
        var apex = 'pedalmap.es'
        var legacy =
          h === 'pedalmap-79b3a.web.app' ||
          h === 'pedalmap-79b3a.firebaseapp.com' ||
          h === 'www.pedalmap.es'
        if (legacy) {
          location.replace(
            'https://' + apex + location.pathname + location.search + location.hash,
          )
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d3b2b" />
    <meta
      name="description"
      content="PedalMap — crea, guarda y comparte rutas de bicicleta en España con mapa, desnivel, viento y superficie según tu bici."
    />

    <meta property="og:site_name" content="PedalMap" />
    <meta property="og:title" content="PedalMap — Crea tu próxima ruta en bici" />
