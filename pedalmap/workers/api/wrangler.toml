name = "pedalmap-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true

# Free-tier friendly: no paid Cloudflare products required.
# Secrets (wrangler secret put / .dev.vars locally — never commit):
#   ORS_API_KEY
#   STADIA_API_KEY   (commercial Valhalla via Stadia Maps)
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   FIREBASE_SERVICE_ACCOUNT  (JSON string of a Spark-compatible service account)
# Vars:
#   FIREBASE_PROJECT_ID
#   STRIPE_PRICE_MONTHLY
#   STRIPE_PRICE_YEARLY
#   APP_URL
#   ALLOWED_ORIGINS (comma-separated)
#   PREMIUM_ALLOWLIST (optional comma-separated Auth emails — prefer Cloudflare secret;
#                      do not commit personal Gmail. Default in code: premium@pedalmap.es)
#   RESEND_API_KEY / MAIL_FROM (optional transactional mail)
#   STRAVA_CLIENT_ID / STRAVA_CLIENT_SECRET (optional legacy)
#   WAHOO_CLIENT_ID / WAHOO_CLIENT_SECRET / WAHOO_WEBHOOK_TOKEN
#   IGPSPORT_CLIENT_ID / IGPSPORT_CLIENT_SECRET / IGPSPORT_WEBHOOK_TOKEN
#   GARMIN_CLIENT_ID / GARMIN_CLIENT_SECRET / GARMIN_WEBHOOK_TOKEN

[vars]
FIREBASE_PROJECT_ID = "pedalmap-79b3a"
STRIPE_PRICE_MONTHLY = "price_1U2i2oDRDu30ohSLy0PIHXtJ"
STRIPE_PRICE_YEARLY = "price_1U2i69DRDu30ohSLo5EoU9ed"
APP_URL = "https://pedalmap.es"
ALLOWED_ORIGINS = "https://pedalmap.es,https://www.pedalmap.es,https://pedalmap-79b3a.web.app,https://pedalmap-79b3a.firebaseapp.com,http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173"
# PREMIUM_ALLOWLIST: do not commit personal Gmail. Set as Worker secret, e.g.
#   echo 'premium@pedalmap.es,you@…' | npx wrangler secret put PREMIUM_ALLOWLIST
# Code default (if unset): premium@pedalmap.es
