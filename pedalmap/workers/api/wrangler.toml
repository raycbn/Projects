name = "pedalmap-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true

# Free-tier friendly: no paid Cloudflare products required.
# Secrets (wrangler secret put / .dev.vars locally — never commit):
#   ORS_API_KEY
#   STADIA_API_KEY   (commercial Valhalla via Stadia Maps)
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   FIREBASE_SERVICE_ACCOUNT  (JSON string of a Spark-compatible service account)
# Vars:
#   FIREBASE_PROJECT_ID
#   STRIPE_PRICE_MONTHLY
#   STRIPE_PRICE_YEARLY
#   STRIPE_PRICE_GRUPETA_MONTHLY / STRIPE_PRICE_GRUPETA_YEARLY (Pack Grupeta 4 seats)
#   APP_URL
#   ALLOWED_ORIGINS (comma-separated)
#   PREMIUM_ALLOWLIST (optional comma-separated Auth emails — prefer Cloudflare secret;
#                      do not commit personal Gmail. Default in code: premium@pedalmap.es)
#   RESEND_API_KEY / MAIL_FROM (optional transactional mail)
#   STRAVA_CLIENT_ID / STRAVA_CLIENT_SECRET (optional legacy)
#   WAHOO_CLIENT_ID / WAHOO_CLIENT_SECRET / WAHOO_WEBHOOK_TOKEN
#   IGPSPORT_CLIENT_ID / IGPSPORT_CLIENT_SECRET / IGPSPORT_WEBHOOK_TOKEN
#   GARMIN_CLIENT_ID / GARMIN_CLIENT_SECRET / GARMIN_WEBHOOK_TOKEN
#   INSTAGRAM_ACCESS_TOKEN / INSTAGRAM_IG_USER_ID / INSTAGRAM_OPS_TOKEN
#     (own PedalMap IG professional account — see docs/INSTAGRAM_SETUP_PASO_A_PASO.md)
#   SOCIAL_CAMPAIGN_START (optional YYYY-MM-DD, default 2026-08-12) — 90-day SEO posts cron
[vars]
FIREBASE_PROJECT_ID = "pedalmap-79b3a"
STRIPE_PRICE_MONTHLY = "price_1U3Jz2D9NwIvrlQEilHY4AXf"
STRIPE_PRICE_YEARLY = "price_1U3K1LD9NwIvrlQEIIFS5oTG"
# Pack Grupeta (4 seats). LIVE: create prices in Stripe Dashboard / scripts/create-grupeta-stripe-prices.mjs
# TEST ids (sk_test): price_1U3bTpDRDu30ohSLAjHzG2bx (14,99) / price_1U3bTpDRDu30ohSLxl8VRpE6 (119,99)
# Leave empty until LIVE prices exist — solo Premium keeps working.
STRIPE_PRICE_GRUPETA_MONTHLY = ""
STRIPE_PRICE_GRUPETA_YEARLY = ""
APP_URL = "https://pedalmap.es"
ALLOWED_ORIGINS = "https://pedalmap.es,https://www.pedalmap.es,https://pedalmap-79b3a.web.app,https://pedalmap-79b3a.firebaseapp.com,http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173"
# Transactional From (Resend). Receiving still uses IONOS MX.
MAIL_FROM = "PedalMap <aviso@pedalmap.es>"
# 90-day Instagram SEO campaign (cron publishes 1 post/day when secrets exist)
SOCIAL_CAMPAIGN_START = "2026-08-12"
# PREMIUM_ALLOWLIST: Cloudflare secret (not committed). Includes brand + both
# developer Auth emails. Rotate with:
#   echo 'premium@pedalmap.es,dev1@…,dev2@…' | npx wrangler secret put PREMIUM_ALLOWLIST
# Code default (if unset): premium@pedalmap.es

# Daily SEO social publish ~10:00 Europe/Madrid (08:00 UTC winter / adjust if needed)
[triggers]
crons = ["0 8 * * *"]
